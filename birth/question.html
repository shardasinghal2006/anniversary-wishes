<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Question ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e0,#ff8fb1,#ff5d8f);
overflow:hidden;

}

.container{

width:700px;
background:white;
padding:50px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 30px rgba(0,0,0,.25);

animation:fade .8s;

}

h1{

font-family:'Pacifico',cursive;
color:#ff4d88;
font-size:45px;
margin-bottom:20px;

}

p{

font-size:24px;
color:#555;
margin-bottom:35px;

}

.buttons{

display:flex;
justify-content:center;
gap:25px;

}

button{

padding:15px 45px;
font-size:22px;
border:none;
border-radius:40px;
cursor:pointer;
transition:.3s;

}

#yes{

background:#ff4d88;
color:white;

}

#no{

background:#999;
color:white;

}

button:hover{

transform:scale(1.08);

}

#message{

margin-top:30px;
font-size:28px;
font-weight:bold;
color:#ff4d88;

}

.hearts{

position:absolute;
font-size:30px;
animation:float 8s linear infinite;
color:white;

}

.h1{left:10%;animation-delay:0s;}
.h2{left:30%;animation-delay:2s;}
.h3{left:50%;animation-delay:4s;}
.h4{left:70%;animation-delay:6s;}
.h5{left:90%;animation-delay:1s;}

@keyframes float{

0%{

transform:translateY(100vh);
opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120px);
opacity:0;

}

}

@keyframes fade{

from{

opacity:0;
transform:scale(.8);

}

to{

opacity:1;
transform:scale(1);

}

}
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999;
}

.popup-box{

    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:380px;

    animation:pop .3s;

}

.popup-box img{

    width:180px;
    margin-bottom:15px;

}

.popup-box h2{

    color:#ff4d88;
    margin-bottom:10px;

}

.popup-box p{

    color:#555;
    margin-bottom:20px;

}

.popup-buttons button{

    margin:5px;
    padding:12px 25px;

    border:none;
    border-radius:30px;

    background:#ff4d88;
    color:white;

    cursor:pointer;

}

@keyframes pop{

from{

transform:scale(.5);
opacity:0;

}

to{

transform:scale(1);
opacity:1;

}

}
.dudu-box{
    margin:20px 0;
    text-align:center;
}

.dudu-box img{
    width:180px;      /* Change to 200px or 220px if you want it larger */
    height:auto;
    animation:bounce 2s ease-in-out infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}
</style>

</head>

<body>

<div class="hearts h1">❤️</div>
<div class="hearts h2">💕</div>
<div class="hearts h3">💖</div>
<div class="hearts h4">💗</div>
<div class="hearts h5">💞</div>

<div class="container">

<h1>One Question ❤️</h1>
<div class="dudu-box">
    <img src="images.jpg" alt="Dudu">
</div>

<p id="question">
Will You Open My Surprise? 🎁
</p>

<div class="buttons">

<button id="yes" onclick="yesClick()">
Yes ❤️
</button>

<button class="no-btn" onclick="showSad()">No 😢</button>
</div>

<div id="message"></div>

</div>

<audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

// Restore playback position
const savedTime = localStorage.getItem("musicTime");
if (savedTime) {
    music.currentTime = savedTime;
}

// Play music
music.play().catch(() => {
    document.addEventListener("click", () => {
        music.play();
    }, { once: true });
});


let noCount = 0;

function yesClick(){

window.location.href="letter.html";

}

function noClick(){

noCount++;

const msg=document.getElementById("message");

if(noCount==1){

msg.innerHTML="🥺 Why did you click NO?";

}
else if(noCount==2){

msg.innerHTML="💔 Please think again...";

}
else if(noCount==3){

msg.innerHTML="😭 Are you really sure?";

}
else if(noCount==4){

msg.innerHTML="❤️ My heart says you'll click YES.";

}
else{

msg.innerHTML="😊 I will keep waiting... Please click YES ❤️";

}

}
function showSad(){

    document.getElementById("sadPopup").style.display="flex";

}

function closePopup(){

    document.getElementById("sadPopup").style.display="none";

}
</script>
<div id="sadPopup" class="popup">

    <div class="popup-box">

        <img src="bubu-sad.gif" alt="Sad Bubu">

        <h2>🥺 Why did you click No?</h2>

        <p>Please click Yes... I made this with lots of love ❤️</p>

        <div class="popup-buttons">
            <button onclick="closePopup()">Yes ❤️</button>
            <button onclick="closePopup()">I'll Think Again 😊</button>
        </div>

    </div>

</div>
</body>
</html>
