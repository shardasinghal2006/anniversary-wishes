<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 Days Together ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#17082d,#4b1b79,#c42d72);

position:relative;

}

/* Floating Hearts */

.heart{

position:absolute;
bottom:-80px;
font-size:28px;
opacity:.3;
animation:float 8s linear infinite;

}

@keyframes float{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:.4;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

.heart:nth-child(1){left:8%;animation-delay:0s;}
.heart:nth-child(2){left:18%;animation-delay:2s;}
.heart:nth-child(3){left:30%;animation-delay:4s;}
.heart:nth-child(4){left:42%;animation-delay:1s;}
.heart:nth-child(5){left:55%;animation-delay:3s;}
.heart:nth-child(6){left:68%;animation-delay:5s;}
.heart:nth-child(7){left:80%;animation-delay:2s;}
.heart:nth-child(8){left:92%;animation-delay:6s;}

.container{

text-align:center;
color:white;
z-index:5;

}

.hourglass{

font-size:70px;
animation:flip 2s infinite;

}

@keyframes flip{

0%{transform:rotate(0deg);}
50%{transform:rotate(180deg);}
100%{transform:rotate(360deg);}

}

h1{

font-size:55px;
font-family:'Pacifico',cursive;
margin-top:20px;

}

p{

font-size:22px;
margin-top:15px;
opacity:.9;

}

.timer{

display:flex;
justify-content:center;
gap:18px;
margin-top:40px;

}

.box{

width:95px;
height:95px;

background:rgba(255,255,255,.15);

border:2px solid rgba(255,255,255,.25);

backdrop-filter:blur(10px);

border-radius:18px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

box-shadow:0 10px 30px rgba(0,0,0,.3);

}

.num{

font-size:38px;
font-weight:bold;

}

.label{

font-size:14px;
margin-top:6px;
letter-spacing:1px;

}

#message{

margin-top:40px;
font-size:40px;
font-family:'Pacifico',cursive;
color:#ffd6e7;

display:none;

animation:pop 1s;

}

@keyframes pop{

0%{
transform:scale(.5);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

</style>

</head>

<body>

<div class="heart">❤️</div>
<div class="heart">💕</div>
<div class="heart">💖</div>
<div class="heart">💗</div>
<div class="heart">💞</div>
<div class="heart">❤️</div>
<div class="heart">💝</div>
<div class="heart">💕</div>

<div class="container">

<div class="hourglass">⌛</div>

<h1>365 Beautiful Days ❤️</h1>

<p>Our Anniversary Begins In...</p>

<div class="timer">

<div class="box">
<div class="num">00</div>
<div class="label">Days</div>
</div>

<div class="box">
<div class="num">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div class="num">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div class="num" id="seconds">04</div>
<div class="label">Seconds</div>
</div>

</div>

<div id="message">

🎉 Happy 1st Anniversary ❤️

</div>

</div>

<audio autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

let sec=5;

const seconds=document.getElementById("seconds");

const msg=document.getElementById("message");

const timer=setInterval(function(){

sec--;

if(sec>=0){

seconds.innerHTML=String(sec).padStart(2,"0");

}

if(sec==0){

setTimeout(function(){

document.querySelector(".timer").style.display="none";

msg.style.display="block";

},1000);

}

if(sec<0){

clearInterval(timer);

setTimeout(function(){

window.location.href="index.html";

},3500);

}

},1000);

</script>

</body>
</html>
