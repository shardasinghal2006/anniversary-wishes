<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Letter ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e0,#ff8fb1,#ff5d8f);
    overflow:hidden;
}
body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e0,#ff8fb1,#ff5d8f);
overflow:hidden;

}

.container{

text-align:center;
animation:fade 1s;

}


h1{

font-family:'Pacifico',cursive;

font-size:58px;

color:white;

text-shadow:
0 3px 10px rgba(0,0,0,.25);

margin-bottom:35px;

}
button{

padding:18px 55px;

border:none;

border-radius:50px;

font-size:22px;

font-weight:bold;

background:linear-gradient(45deg,#ff4d88,#ff80ab);

color:white;

cursor:pointer;

box-shadow:0 8px 20px rgba(255,77,136,.4);

transition:.3s;

}

button:hover{

transform:translateY(-5px) scale(1.05);

}

.letter{
    width:750px;
    max-width:92%;
    height:500px;

    background:#fffaf2;

    border-radius:20px;

    border:8px solid #ffd6e0;

    box-shadow:
    0 15px 40px rgba(0,0,0,.25),
    inset 0 0 15px rgba(255,200,220,.5);

    padding:45px;

    overflow-y:auto;
    overflow-x:hidden;

    position:relative;

    text-align:left;

    line-height:2.2;

    font-size:20px;

    color:#555;
}

#typing{
    white-space:pre-wrap;
    word-wrap:break-word;
    border-right:3px solid #ff4d88;
}
.letter::-webkit-scrollbar{
    width:10px;
}

.letter::-webkit-scrollbar-track{
    background:#ffe6ee;
    border-radius:20px;
}

.letter::-webkit-scrollbar-thumb{
    background:#ff4d88;
    border-radius:20px;
}

.letter::-webkit-scrollbar-thumb:hover{
    background:#ff2f73;
}
button{

margin-top:35px;
padding:15px 45px;
font-size:20px;
border:none;
border-radius:40px;
cursor:pointer;

background:#ff4d88;
color:white;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}
.corner{

position:absolute;

font-size:40px;

}

.top-left{

top:10px;
left:20px;

}

.top-right{

top:10px;
right:20px;

}

.seal{

position:absolute;

top:-28px;

left:50%;

transform:translateX(-50%);

background:#ff4d88;

width:60px;
height:60px;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

font-size:28px;

box-shadow:0 5px 15px rgba(0,0,0,.2);

}

.signature{

margin-top:40px;

text-align:right;

font-family:'Pacifico',cursive;

font-size:28px;

color:#ff4d88;

}

.heart{

position:absolute;
font-size:28px;
animation:float 8s linear infinite;
color:white;

}

.h1{left:10%;animation-delay:0s;}
.h2{left:30%;animation-delay:2s;}
.h3{left:50%;animation-delay:4s;}
.h4{left:70%;animation-delay:6s;}
.h5{left:90%;animation-delay:1s;}

@keyframes float{

0%{

transform:translateY(100vh);
opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120px);
opacity:0;

}

}

@keyframes fade{

from{

opacity:0;
transform:scale(.8);

}

to{

opacity:1;
transform:scale(1);

}

}

</style>

</head>

<body>

<div class="heart h1">❤️</div>
<div class="heart h2">💕</div>
<div class="heart h3">💖</div>
<div class="heart h4">💗</div>
<div class="heart h5">💞</div>

<div class="heart h2">💕</div>
<div class="heart h3">💖</div>
<div class="heart h4">💗</div>
<div class="heart h5">💞</div>
<div class="container">

<h1>💌 A Letter For You 💌</h1>
<div class="letter">

<div class="corner top-left">🌹</div>
<div class="corner top-right">🌹</div>

<div class="seal">❤️</div>

<p id="typing"></p>

<div class="signature">

With Endless Love ❤️<br>

<b>Your Saru 💋</b>

</div>

</div>

<button onclick="nextPage()">

Next ❤️

</button>

</div>

<audio autoplay loop>

<source src="music.mp3" type="audio/mpeg">

</audio>

}

type();

function nextPage(){

window.location.href="anniversary.html";

}

</script>

</body>
</html>
