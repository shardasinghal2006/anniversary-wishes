<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Video</title>

    <style>
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center,
            rgba(255,255,255,.55) 0%,
            rgba(255,255,255,.2) 25%,
            rgba(248,182,203,.8) 45%,
            rgba(242,153,181,.9) 70%,
            #f48fb1 100%);
}

.container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}
#videoContainer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    justify-content: center;
    align-items: center;
}

#myVideo {
    width: 600px;      /* Change this to your preferred size */
    max-width: 90%;
    max-height: 120vh;
    object-fit: contain;
}
#playBtn{
    width:120px;
    height:120px;
    border:none;
    border-radius:50%;
    background:#ff0000;
    color:#fff;
    font-size:50px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(255,0,0,.35);
    transition:.3s;
}

#playBtn:hover{
    transform:scale(1.1);
}




    </style>
</head>
<body>

<div class="container">

    <!-- Play Button -->
    <button id="playBtn">▶</button>

    <!-- Video -->
    <div id="videoContainer">
        <video id="myVideo" controls>
            <source src="vc/video.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

</div>

<script>
    const playBtn = document.getElementById("playBtn");
    const videoContainer = document.getElementById("videoContainer");
    const video = document.getElementById("myVideo");

   playBtn.addEventListener("click", function () {
    playBtn.style.display = "none";
    videoContainer.style.display = "flex";   // <-- use flex instead of block
    video.play();
});
</script>

</body>
</html>
